services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: gamelogs
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d gamelogs']
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/gamelogs?schema=public
      INGEST_API_KEY: ${INGEST_API_KEY:-dev-ingest-key}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  pgdata:
